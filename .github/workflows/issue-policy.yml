name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { requiresPullRequestPolicy, validatePullRequest } from './.github/issue-management/policy.mjs'

          const eventPath = process.env.GITHUB_EVENT_PATH
          const token = process.env.GITHUB_TOKEN
          const repository = process.env.GITHUB_REPOSITORY ?? ''
          if (!eventPath) throw new Error('GITHUB_EVENT_PATH is not set')
          if (!token) throw new Error('GITHUB_TOKEN is not set')
          const [owner, repositoryName, ...extraRepositoryParts] = repository.split('/')
          if (!owner || !repositoryName || extraRepositoryParts.length > 0) {
            throw new Error('GITHUB_REPOSITORY must be owner/repository')
          }

          const apiBase = new URL(process.env.GITHUB_API_URL ?? 'https://api.github.com')
          const localHttp = apiBase.protocol === 'http:'
            && ['127.0.0.1', 'localhost', '[::1]'].includes(apiBase.hostname)
          if (apiBase.protocol !== 'https:' && !localHttp) {
            throw new Error('GITHUB_API_URL must use HTTPS')
          }
          if (apiBase.username || apiBase.password || apiBase.search || apiBase.hash) {
            throw new Error('GITHUB_API_URL must not contain credentials, a query, or a fragment')
          }
          const apiRoot = `${apiBase.origin}${apiBase.pathname.replace(/\/+$/, '')}`
          const repositoryPath = `repos/${encodeURIComponent(owner)}/${encodeURIComponent(repositoryName)}`
          const request = async (path) => {
            const response = await fetch(`${apiRoot}/${repositoryPath}/${path}`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2026-03-10',
                'User-Agent': 'dsh-issue-policy',
              },
              signal: AbortSignal.timeout(15_000),
            })
            if (!response.ok) throw new Error(`GET ${path} returned HTTP ${response.status}`)
            if (response.status === 204) return null
            return response.json()
          }
          const event = JSON.parse(fs.readFileSync(eventPath, 'utf8'))
          const pullNumber = Number(event.pull_request?.number)
          if (!Number.isSafeInteger(pullNumber) || pullNumber < 1) {
            throw new Error('The event does not contain a valid pull request number')
          }
          const [pull, reviewerRequest, reviews] = await Promise.all([
            request(`pulls/${pullNumber}`),
            request(`pulls/${pullNumber}/requested_reviewers`),
            request(`pulls/${pullNumber}/reviews?per_page=100`),
          ])
          const policyContext = {
            isDraft: pull.draft === true,
            authorType: pull.user?.type ?? '',
            reviewRequestCount: (reviewerRequest.users?.length ?? 0) + (reviewerRequest.teams?.length ?? 0),
            reviewCount: reviews.length,
          }
          if (!requiresPullRequestPolicy(policyContext)) {
            process.stdout.write('PR 尚未进入 Issue policy 强制范围。\n')
          } else {
            const labels = pull.labels.map((label) => label.name)
            const errors = validatePullRequest({ ...policyContext, labels })
            if (errors.length > 0) {
              for (const error of errors.slice(0, 20)) {
                const safe = error.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A').replace(/:/g, '%3A').replace(/,/g, '%2C')
                process.stdout.write(`::error::${safe}\n`)
              }
              if (errors.length > 20) process.stdout.write(`::error::其余 ${errors.length - 20} 项错误已省略\n`)
              throw new Error(`Issue policy 未通过，共 ${errors.length} 项`)
            }
            process.stdout.write('Issue policy 通过。\n')
          }
          NODE
