name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - closed
      - reopened
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - review_requested
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    # Optional Project integration keeps a successful no-op job when disabled.
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate Project configuration
        if: ${{ vars.DSH_ISSUE_PROJECT_ENABLED == 'true' && github.event.sender.type != 'Bot' && github.event.sender.type != 'App' && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.user.type != 'App' && (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') }}
        run: node .github/issue-management/policy.mjs validate-config
      - name: Create project token
        id: app-token
        if: ${{ vars.DSH_ISSUE_PROJECT_ENABLED == 'true' && github.event.sender.type != 'Bot' && github.event.sender.type != 'App' && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.user.type != 'App' && (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Handle repository event
        if: ${{ vars.DSH_ISSUE_PROJECT_ENABLED == 'true' && github.event.sender.type != 'Bot' && github.event.sender.type != 'App' && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.user.type != 'App' && (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DSH_ISSUE_PROJECT_ENABLED: ${{ vars.DSH_ISSUE_PROJECT_ENABLED }}
        run: node .github/issue-management/policy.mjs lifecycle
